
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-intelligence-agent:local
    command:
      - uvicorn
      - src.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - .env
    environment:
      HF_HOME: /models/huggingface
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/models/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: document-intelligence-agent:local
    depends_on:
      api:
        condition: service_healthy
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPATH: /app
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  huggingface_cache:
